<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaveFlow | Leave Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>LeaveFlow</h1>
      <p>Leave management and leave request software for small teams.</p>
    </header>

    <section class="panel grid stats" aria-label="Leave summary">
      <article>
        <h2>Total Requests</h2>
        <p id="totalCount">0</p>
      </article>
      <article>
        <h2>Pending</h2>
        <p id="pendingCount">0</p>
      </article>
      <article>
        <h2>Approved</h2>
        <p id="approvedCount">0</p>
      </article>
      <article>
        <h2>Rejected</h2>
        <p id="rejectedCount">0</p>
      </article>
    </section>

    <section class="grid two-col">
      <form id="employeeForm" class="panel" autocomplete="off">
        <h2>Add Employee</h2>
        <label>
          Name
          <input id="employeeName" required placeholder="e.g. Alice Johnson" />
        </label>
        <label>
          Department
          <input id="employeeDepartment" required placeholder="e.g. Engineering" />
        </label>
        <button type="submit">Add Employee</button>
      </form>

      <form id="leaveForm" class="panel" autocomplete="off">
        <h2>Create Leave Request</h2>
        <label>
          Employee
          <select id="employeeSelect" required>
            <option value="">Choose an employee</option>
          </select>
        </label>
        <label>
          Leave Type
          <select id="leaveType" required>
            <option value="">Choose type</option>
            <option>Vacation</option>
            <option>Sick Leave</option>
            <option>Personal</option>
            <option>Maternity/Paternity</option>
            <option>Unpaid</option>
          </select>
        </label>
        <div class="grid two-inputs">
          <label>
            Start Date
            <input id="startDate" type="date" required />
          </label>
          <label>
            End Date
            <input id="endDate" type="date" required />
          </label>
        </div>
        <label>
          Reason
          <textarea id="reason" rows="3" required placeholder="Reason for leave"></textarea>
        </label>
        <button type="submit">Submit Request</button>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>Leave Requests</h2>
        <label>
          Filter
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Department</th>
              <th>Type</th>
              <th>Dates</th>
              <th>Days</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="requestRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
